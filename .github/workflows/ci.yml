name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions: {}

jobs:
  bandit:
    name: Run Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -r . -f txt

  semgrep:
    name: Run Semgrep OSS
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run Semgrep Scan
        run: semgrep scan --config auto .

  trivy:
    name: Run Trivy Scan
    runs-on: ubuntu-latest
    needs: [bandit, semgrep]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Generate Trivy Filesystem SARIF Report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs-scan'

      - name: Scan Filesystem with Trivy (Table & Fail check)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  codeql:
    name: Analyze CodeQL
    runs-on: ubuntu-latest
    needs: [bandit, semgrep]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: 'python'
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: "/language:python"

  sboms-and-grype:
    name: Generate SBOM & Scan Dependencies (Syft + Grype)
    runs-on: ubuntu-latest
    needs: [bandit, semgrep]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'sbom.cyclonedx.json'
          upload-artifact: false

      - name: Scan SBOM with Grype (SARIF export)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          sbom: 'sbom.cyclonedx.json'
          output-format: 'sarif'
          output-file: 'results.sarif'
          severity-cutoff: 'critical'
          fail-build: 'false'

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0
        if: always()
        with:
          sarif_file: 'results.sarif'
          category: 'grype-sbom-scan'

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  docker-build-push:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    needs: [codeql, sboms-and-grype]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=commit-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  scorecard:
      name: OpenSSF Scorecard Analysis
      runs-on: ubuntu-latest
      needs: [codeql, sboms-and-grype]
      permissions:
        security-events: write
        id-token: write
        contents: read
        actions: read
      steps:
        - name: Check out repository
          uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

        - name: Run OpenSSF Scorecard analysis
          uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
          with:
            results_file: scorecard-results.sarif
            results_format: sarif
            publish_results: true

        - name: Upload Scorecard SARIF to GitHub Security
          uses: github/codeql-action/upload-sarif@416ff0dea110f80f0f56f0046500dbf7420e4bb0
          if: always()
          with:
            sarif_file: 'scorecard-results.sarif'
            category: 'scorecard'
