name: CodeQL Security Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Check out repository
        # actions/checkout@v4.1.7
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Initialize CodeQL
        # github/codeql-action/init@v3.25.15
        uses: github/codeql-action/init@4fa3a0092dd1b380ed63337f198124011fa5ebdb
        with:
          languages: 'python'
          queries: security-extended

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v3.25.15
        uses: github/codeql-action/analyze@4fa3a0092dd1b380ed63337f198124011fa5ebdb
